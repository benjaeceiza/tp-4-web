<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TP4 · Participante - Regalo Grupal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <h1>Regalo Grupal · Participante</h1>

    <!-- Mensajes de error generales -->
    <div id="error-box" class="alert alert-error hidden"></div>

    <!-- Paso 1: Ingresar nombre -->
    <div id="login-section" class="card">
      <h2>Ingresar a la lista</h2>
      <form id="join-form">
        <input
          type="text"
          id="name-input"
          placeholder="Tu nombre (2 a 20 caracteres)"
          required
        />
        <button type="submit">Entrar</button>
      </form>
    </div>

    <!-- Paso 2: Panel principal (visible tras recibir 'welcome') -->
    <div id="app-section" class="hidden">
      <div class="card">
        <p>Conectado como: <strong id="my-name"></strong></p>
        <h3>Participantes conectados (<span id="participants-count">0</span>)</h3>
        <div id="participants-list"></div>
      </div>

      <!-- Proponer productos -->
      <div class="card">
        <h3>Proponer productos del catálogo (DummyJSON)</h3>
        <p style="font-size: 13px; color: #64748b; margin-top: 0;">
          Ingresá entre 1 y 10 IDs separados por coma (ej: <code>1, 2, 5</code> o <code>1, 9999</code> para probar fallo parcial).
        </p>
        <form id="propose-form">
          <input
            type="text"
            id="product-ids-input"
            placeholder="Ej: 1, 2, 3"
            style="width: 260px;"
            required
          />
          <button type="submit" id="propose-btn">Proponer</button>
        </form>
        <div id="propose-feedback"></div>
      </div>

      <!-- Ranking de productos -->
      <div class="card">
        <h3>Lista de productos (ordenada por votos)</h3>
        <div id="products-list" class="product-list"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
